<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PQC-20949 - Quantum Safe Chain - Public</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:15px}
button{background:#0f0;color:#000;padding:12px 20px;border:0;font-weight:bold;cursor:pointer;margin:5px;width:100%}
input{width:100%;padding:12px;background:#111;color:#0f0;border:1px solid #0f0;margin:5px 0}
.card{border:1px solid #0f0;padding:15px;margin:10px 0;background:#0a0a0a}
h2{color:#0f0}
.hash{font-size:10px;word-break:break-all;color:#0ff}
</style>
</head>
<body>
<h1>🛡️ PQC-20949 - QUANTUM SAFE CHAIN</h1>
<p>Public Shared Chain - Block Vercel pe mine hoga - Sabko dikhega!</p>

<div class="card">
<h2>1. Generate PQC1 Wallet (Non-EVM - Quantum Safe)</h2>
<button onclick="genWallet()">GENERATE PQC1 WALLET</button>
<div id="wallet"></div>
</div>

<div class="card">
<h2>2. Faucet 10 PQC - Public</h2>
<input id="addr" placeholder="PQC1... address yaha paste karo">
<button onclick="faucet()">CLAIM 10 PQC - BLOCK YAHI MINE HOGA</button>
<div id="faucetRes"></div>
</div>

<div class="card">
<h2>3. Balance Check - Kisi ka bhi PQC1</h2>
<input id="balAddr" placeholder="PQC1...">
<button onclick="checkBal()">CHECK BALANCE</button>
<div id="balRes"></div>
</div>

<div class="card">
<h2>4. Explorer - Public Blocks (Sabke)</h2>
<button onclick="getBlocks()">REFRESH BLOCKS</button>
<button onclick="getSupply()">SUPPLY CHECK 21M</button>
<div id="explorer"></div>
</div>

<script>
const API = "https://qkyb-wallet.vercel.app/api";

function genWallet(){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let pqc = "PQC1";
  for(let i=0;i<20;i++) pqc+=chars[Math.floor(Math.random()*chars.length)];
  const seed = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const priv = "PQC_PRIV_"+seed.slice(0,40);
  document.getElementById('wallet').innerHTML = `
    <b>PQC1 Address:</b> ${pqc}<br>
    <b>Seed (SAVE!):</b> <span class="hash">${seed}</span><br>
    <b>Private Key:</b> <span class="hash">${priv}</span><br>
    <button onclick="document.getElementById('addr').value='${pqc}';document.getElementById('balAddr').value='${pqc}'">USE THIS ADDRESS</button>
  `;
}

async function faucet(){
  const addr = document.getElementById('addr').value.trim().toUpperCase();
  if(!addr) return alert('PQC1 address daalo');
  document.getElementById('faucetRes').innerHTML = "Mining... Block yahi mine ho raha hai Vercel pe...";
  try{
    const res = await fetch(`${API}/faucet`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({address: addr})
    });
    const data = await res.json();
    if(data.success){
      document.getElementById('faucetRes').innerHTML = `
        ✅ ${data.message}<br>
        <span class="hash">Hash: ${data.block.hash}</span><br>
        Block #${data.block.index} - Prev: ${data.block.prev_hash.slice(0,20)}...<br>
        Balance: ${data.balance} PQC
      `;
      getBlocks();
    } else {
      document.getElementById('faucetRes').innerHTML = "Error: "+(data.error||'Failed');
    }
  }catch(e){
    document.getElementById('faucetRes').innerHTML = "API offline hai - Vercel backend check karo! Error: "+e.message+"<br><br>Fallback: Local mine...";
    // Fallback local (agar Vercel down ho)
    const bal = parseInt(localStorage.getItem('pqc_bal_'+addr)||'0')+10;
    localStorage.setItem('pqc_bal_'+addr, bal);
    document.getElementById('faucetRes').innerHTML += `<br>Local Balance: ${bal} PQC (Vercel live karo public ke liye)`;
  }
}

async function checkBal(){
  const addr = document.getElementById('balAddr').value.trim().toUpperCase();
  if(!addr) return alert('Address daalo');
  try{
    const res = await fetch(`${API}/balance?address=${addr}`);
    const data = await res.json();
    document.getElementById('balRes').innerHTML = `Address: ${data.address}<br>Balance: ${data.balance} PQC (Public Shared)`;
  }catch(e){
    const bal = localStorage.getItem('pqc_bal_'+addr)||'0';
    document.getElementById('balRes').innerHTML = `Local Balance: ${bal} PQC (Vercel API offline)`;
  }
}

async function getBlocks(){
  try{
    const res = await fetch(`${API}/blocks`);
    const chain = await res.json();
    let html = `<b>Total Blocks: ${chain.length} (Public)</b><br><br>`;
    chain.slice(-10).reverse().forEach(b=>{
      html+=`Block #${b.index} | Tx: ${b.tx} | Amt: ${b.amount} PQC | <span class="hash">${b.hash.slice(0,30)}...</span><br><br>`;
    });
    document.getElementById('explorer').innerHTML = html;
  }catch(e){
    document.getElementById('explorer').innerHTML = "API offline - Vercel backend live karo!";
  }
}

async function getSupply(){
  try{
    const res = await fetch(`${API}/supply`);
    const data = await res.json();
    document.getElementById('explorer').innerHTML = `
      <b>Supply Status (Public Shared):</b><br>
      Minted: ${data.minted} PQC<br>
      Remaining: ${data.remaining} PQC<br>
      Total: ${data.total} PQC / 21M<br>
      Blocks: ${data.minted/10} (10 PQC per block)
    `;
  }catch(e){
    document.getElementById('explorer').innerHTML = "Supply check failed - API offline";
  }
}

// Auto load blocks on start
getBlocks();
</script>
</body>
</html>
